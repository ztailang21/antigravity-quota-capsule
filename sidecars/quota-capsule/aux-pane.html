<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quota Capsule — Antigravity Plugin</title>
  <style>
    :root {
      --bg: #131519;
      --surface: #1b1e24;
      --surface-2: #22262f;
      --border: #2c313c;
      --text: #e6eaf2;
      --muted: #8f98a8;
      --green: #5cb062;
      --amber: #e8ac3e;
      --red: #e45c5c;
      --accent: #6ea8fe;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fb;
        --surface: #ffffff;
        --surface-2: #eef2f8;
        --border: #d7dee9;
        --text: #1c222d;
        --muted: #667085;
        --accent: #2563eb;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--green); }
    .dot.warn { background: var(--amber); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .card-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .card-title { font-weight: 700; font-size: 13px; }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: rgba(110, 168, 254, 0.16); border-color: rgba(110, 168, 254, 0.45); color: var(--accent); }
    .sec-name { font-weight: 700; font-size: 13px; margin: 6px 0; display: flex; align-items: center; gap: 8px; }
    .active-tag {
      font-size: 10px; padding: 1px 7px; border-radius: 999px;
      background: rgba(92, 176, 98, 0.2); color: var(--green); font-weight: 700;
    }
    .q-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
    .q-meta { display: flex; flex-direction: column; gap: 1px; }
    .q-label { color: var(--muted); font-size: 12px; }
    .q-reset { color: var(--muted); font-size: 11.5px; opacity: 0.9; }
    .q-val { display: flex; align-items: center; gap: 9px; font-variant-numeric: tabular-nums; }
    .divider { height: 1px; background: var(--border); margin: 8px 0; }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 7px 0; border-bottom: 1px solid rgba(128,128,128,0.1);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-desc { font-size: 11.5px; color: var(--muted); }
    select, input[type="text"] {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; padding: 4px 8px; font-size: 12px; font-family: inherit;
    }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; }
    .diag { font-family: Consolas, monospace; font-size: 11.5px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
    .alert {
      border-radius: 10px; padding: 10px 12px; font-size: 12px;
      background: rgba(232, 172, 62, 0.12); border: 1px solid rgba(232, 172, 62, 0.35); color: var(--text);
    }
    code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 11.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">Antigravity Quota Capsule</div>
      <div id="connBadge" class="badge"><span class="dot"></span><span>检测中...</span></div>
    </div>

    <div id="cdpHint" class="alert" style="display:none;"></div>

    <div class="card">
      <div class="card-hdr">
        <div>
          <span class="card-title" id="quotaTitle">实时额度概览</span>
          <span id="freshness" style="font-size:11px;color:var(--muted);margin-left:6px;"></span>
        </div>
        <button id="syncBtn" class="btn primary">↻ 立即同步</button>
      </div>
      <div id="quotaBody"></div>
    </div>

    <div class="card">
      <div class="card-hdr">
        <span class="card-title">底栏胶囊设置</span>
      </div>

      <div class="setting-row">
        <div>
          <div>启用底栏额度胶囊</div>
          <div class="setting-desc">在输入框「模型选择器」与「极速 (Turbo)」之间显示</div>
        </div>
        <input id="optEnabled" type="checkbox" />
      </div>

      <div class="setting-row">
        <div>
          <div>胶囊显示密度</div>
          <div class="setting-desc">默认按空位宽度自动切换（宽/标准/极简）</div>
        </div>
        <select id="optDensity">
          <option value="auto">自动适配 (推荐)</option>
          <option value="both">双组并排 (Gemini + C/G)</option>
          <option value="active">仅当前模型组</option>
          <option value="compact">极简圆环 + 百分比</option>
        </select>
      </div>

      <div class="setting-row">
        <div>
          <div>点开胶囊自动尝试同步最新额度</div>
          <div class="setting-desc">缓存超过 60 秒时自动读取最新数据</div>
        </div>
        <input id="optAutoSync" type="checkbox" />
      </div>

      <div class="setting-row">
        <div>
          <div>鼠标悬停展开完整 4 项卡片</div>
          <div class="setting-desc">关闭时需左键点击胶囊展开</div>
        </div>
        <input id="optHover" type="checkbox" />
      </div>

      <div class="setting-row">
        <div>
          <div>界面语言</div>
          <div class="setting-desc">底栏胶囊与详情卡片文案语言</div>
        </div>
        <select id="optLang">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="setting-row">
        <div>
          <div>演示预览模式 (图 1 示例数据)</div>
          <div class="setting-desc">便于快速预览底栏胶囊与弹层外观</div>
        </div>
        <input id="optDemo" type="checkbox" />
      </div>

      <div class="setting-row">
        <div>
          <div>自定义额度入口按钮关键词 (可选)</div>
          <div class="setting-desc">一键同步未命中时可填入原生额度按钮名称</div>
        </div>
        <input id="optTriggerKw" type="text" placeholder="如：额度 / Usage" style="width:140px;" />
      </div>
    </div>

    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Windows 连接诊断</span>
      </div>
      <div id="diagBox" class="diag">加载中...</div>
    </div>
  </div>

  <script>
    let latestState = null;

    function ringSvg(pct, size, stroke) {
      const r = (size - stroke) / 2;
      const cx = size / 2;
      const circ = 2 * Math.PI * r;
      const valid = pct > 0 ? Math.min(100, pct) : 0;
      const offset = circ * (1 - valid / 100);
      let color = "#5cb062";
      if (pct < 20) color = "#e45c5c";
      else if (pct < 50) color = "#e8ac3e";
      const arc = valid > 0
        ? `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`
        : "";
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="rgba(128,136,152,0.35)" stroke-width="${stroke}"/>
        ${arc}
      </svg>`;
    }

    function fmtReset(m, now, zh) {
      if (!m || !m.resetAtMs) return m?.rawResetText || (zh ? "等待同步..." : "Waiting...");
      const diff = m.resetAtMs - now;
      if (diff <= 0) return zh ? "已到重置时间（点击刷新）" : "Reset reached";
      if (diff < 60000) return zh ? "不到 1 分钟 后重置" : "Resets in <1m";
      const mins = Math.ceil(diff / 60000);
      const d = Math.floor(mins / 1440);
      const h = Math.floor((mins % 1440) / 60);
      const mm = mins % 60;
      if (zh) {
        if (d > 0) return h > 0 ? `${d} 天 ${h} 小时 后重置` : `${d} 天 后重置`;
        if (h > 0) return mm > 0 ? `${h} 小时 ${mm} 分钟 后重置` : `${h} 小时 后重置`;
        return `${mm} 分钟 后重置`;
      }
      if (d > 0) return h > 0 ? `Resets in ${d}d ${h}h` : `Resets in ${d}d`;
      if (h > 0) return mm > 0 ? `Resets in ${h}h ${mm}m` : `Resets in ${h}h`;
      return `Resets in ${mm}m`;
    }

    function render(s) {
      latestState = s;
      const zh = (s.config?.language || "zh") !== "en";
      const now = Date.now();
      const cdp = s.cdpStatus || {};
      const ws = s.widgetStatus || {};

      const badge = document.getElementById("connBadge");
      const hint = document.getElementById("cdpHint");
      if (cdp.connected && ws.mounted) {
        badge.innerHTML = `<span class="dot ok"></span><span>已挂载到底栏 (:${cdp.port})</span>`;
        hint.style.display = "none";
      } else if (cdp.connected) {
        badge.innerHTML = `<span class="dot warn"></span><span>CDP 已连，等待输入框</span>`;
        hint.style.display = "none";
      } else {
        badge.innerHTML = `<span class="dot warn"></span><span>等待调试端口</span>`;
        hint.style.display = "block";
        hint.innerHTML = `底栏注入需要 Antigravity 快捷方式带有 <code>--remote-debugging-address=127.0.0.1 --remote-debugging-port=0</code> 参数。<br/>请运行插件目录中的 <code>scripts\\install.ps1</code> 并重启 Antigravity。`;
      }

      const q = s.quota || {};
      const row = (lbl, m) => {
        const pct = m && m.remainingPercent >= 0 ? m.remainingPercent : -1;
        return `<div class="q-row">
          <div class="q-meta">
            <div class="q-label">${lbl}</div>
            <div class="q-reset">${fmtReset(m, now, zh)}</div>
          </div>
          <div class="q-val">
            <span>${pct >= 0 ? (zh ? `${pct}% 剩余` : `${pct}% left`) : "--"}</span>
            ${ringSvg(pct, 18, 2.3)}
          </div>
        </div>`;
      };

      const gAct = s.activeGroup === "gemini" ? `<span class="active-tag">${zh ? "当前" : "Active"}</span>` : "";
      const cAct = s.activeGroup === "claudeGpt" ? `<span class="active-tag">${zh ? "当前" : "Active"}</span>` : "";

      document.getElementById("quotaBody").innerHTML = `
        <div class="sec-name">Gemini 模型 ${gAct}</div>
        ${row("周限额", q.geminiWeekly)}
        ${row("5 小时限额", q.geminiFiveHour)}
        <div class="divider"></div>
        <div class="sec-name">Claude 和 GPT 模型 ${cAct}</div>
        ${row("周限额", q.claudeGptWeekly)}
        ${row("5 小时限额", q.claudeGptFiveHour)}
      `;

      document.getElementById("freshness").textContent = q.capturedAtMs
        ? `· ${new Date(q.capturedAtMs).toLocaleTimeString()} (${q.source || "DOM"})`
        : "· 尚未同步";

      document.getElementById("optEnabled").checked = Boolean(s.config.enabled);
      document.getElementById("optDensity").value = s.config.density || "auto";
      document.getElementById("optAutoSync").checked = Boolean(s.config.autoSyncOnClick);
      document.getElementById("optHover").checked = Boolean(s.config.openOnHover);
      document.getElementById("optLang").value = s.config.language || "zh";
      document.getElementById("optDemo").checked = Boolean(s.config.demoMode);
      const kwInput = document.getElementById("optTriggerKw");
      if (document.activeElement !== kwInput) {
        kwInput.value = s.config.customTriggerKeyword || "";
      }

      const ns = s.nativeSync || {};
      document.getElementById("diagBox").textContent = [
        `CDP Connected : ${Boolean(cdp.connected)} (port=${cdp.port || "-"})`,
        `Port Source   : ${cdp.portFile || "-"}`,
        `Native LS Env : ${Boolean(ns.hasLsEnv)} (keys=${(ns.envKeyNames || []).join(",") || "-"})`,
        `Native Sync   : ${ns.lastNativeSource || "-"}`,
        `Composer Slot : mounted=${Boolean(ws.mounted)}, width=${ws.slotWidth || 0}px`,
        `Active Model  : ${s.activeModelName || "-"} (${s.activeGroup || "unknown"})`,
        cdp.lastError ? `Last Note     : ${cdp.lastError}` : null,
      ].filter(Boolean).join("\n");
    }

    async function fetchState() {
      try {
        const res = await fetch("/api/state");
        if (res.ok) render(await res.json());
      } catch {
        // ignore transient errors
      }
    }

    async function patchConfig(patch) {
      const res = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      if (res.ok) render(await res.json());
    }

    document.getElementById("optEnabled").addEventListener("change", (e) => patchConfig({ enabled: e.target.checked }));
    document.getElementById("optDensity").addEventListener("change", (e) => patchConfig({ density: e.target.value }));
    document.getElementById("optAutoSync").addEventListener("change", (e) => patchConfig({ autoSyncOnClick: e.target.checked }));
    document.getElementById("optHover").addEventListener("change", (e) => patchConfig({ openOnHover: e.target.checked }));
    document.getElementById("optLang").addEventListener("change", (e) => patchConfig({ language: e.target.value }));
    document.getElementById("optDemo").addEventListener("change", (e) => patchConfig({ demoMode: e.target.checked }));
    document.getElementById("optTriggerKw").addEventListener("change", (e) => patchConfig({ customTriggerKeyword: e.target.value.trim() }));
    document.getElementById("syncBtn").addEventListener("click", async () => {
      await fetch("/api/sync", { method: "POST" });
      setTimeout(fetchState, 600);
    });

    fetchState();
    setInterval(fetchState, 2500);
  </script>
</body>
</html>
